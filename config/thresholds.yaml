# =============================================================================
# 1. Geometry Checks
# =============================================================================
geometry:
  # Interatomic distances [Å]
  
  d_min_reject: 0.7
  # If distance < 0.7 -> the structure is rejected (overlap/physically impossible).
  # Code var: min_interatomic_distance
  
  d_max_suspicious: 1.2
  # Suspicious-distance threshold.
  # If 0.7 < distance < 1.2 -> warning (requires manual inspection).

  # Volume per atom [Å^3/atom]
  vol_min: 8.0
  # Minimum volume. Excessively dense packing -> generation error.
  # Code var: min_volume_per_atom
  
  vol_max: 40.0
  # Maximum volume. Excessively large cell -> vacuum/scaling error.
  # Code var: max_volume_per_atom

# =============================================================================
# 2. Physical Properties
# =============================================================================
physical_properties:
  # Density [g/cm^3]
  # Default values from geometry_checks.py
  
  min_density: 0.5
  # < 0.5 -> rejected (unrealistic for a solid).
  
  max_density: 30.0
  # Maximum density (for example, for heavy metals/osmides).

# =============================================================================
# 3. System Limits
# =============================================================================
system_limits:
  # Performance limits (CPU validation pipeline)
  
  max_n_atoms: 500
  # Maximum number of atoms in the cell.
  # Code var: max_n_atoms

# =============================================================================
# 4. Chemistry & Oxidation States
# =============================================================================
oxidation_states:
  # Format: Element: [list of possible states]
  # States can be integers or strings. Using integers here is fine for YAML.
  
  Ti: [2, 3, 4]
  V:  [2, 3, 4, 5]
  Cr: [2, 3, 6]
  Mn: [2, 3, 4, 6, 7]
  Fe: [2, 3]
  Co: [2, 3]
  Ni: [2, 3]
  Cu: [1, 2]
  Zn: [2]

  Mo: [4, 5, 6]
  Ru: [3, 4, 5]
  Rh: [3]
  Pd: [2, 4]
  Re: [4, 5, 6, 7]
  Os: [4, 6, 8]
  Ir: [3, 4, 5]

  Sc: [3]
  Y:  [3]
  La: [3]
  Ce: [3, 4]
  Pr: [3, 4]
  Nd: [3]
  Pm: [3]
  Sm: [2, 3]
  Eu: [2, 3]
  Gd: [3]
  Tb: [3, 4]
  Dy: [3]
  Ho: [3]
  Er: [3]
  Tm: [2, 3]
  Yb: [2, 3]
  Lu: [3]
 
  H:  [-1, 1]
  C:  [-4, 2, 4]
  N:  [-3, 3, 5]
  O:  [-2, -1]
  P:  [-3, 3, 5]
  S:  [-2, 4, 6]

  Li: [1]
  Na: [1]
  K: [1]
  Rb: [1]
  Cs: [1]

  Be: [2]
  Mg: [2]
  Ca: [2]
  Sr: [2]
  Ba: [2]

# =============================================================================
# 5. Magnetic Properties
# =============================================================================
magnetic_elements:
