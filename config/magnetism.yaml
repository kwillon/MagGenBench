magnetism:
  enabled: true

  prediction:
    enabled: false
    input:
      structures_table: "tables/04_magnetic_screening/master_structures.downsampled.with_status.classes.clean_v2.csv"
      structure_id_column: "structure_id"
      cif_path_column: "cif_path"
    backend:
      name: "fake"
      model_name: "deterministic-fake-v1"
      artifact_path: ""
      baseline_error: 0.25
      uncertainty_samples: 12
      uncertainty_noise: 0.0001
      uncertainty_seed: 42
      allow_unsafe_compatibility: false
      metadata:
        model_name: "deterministic-fake-v1"
        model_version: ""
        artifact_path: ""
        artifact_sha256: ""
        feature_set: "composition_magpie"
        feature_labels: []
        feature_count:
        target_name: ""
        moment_unit: "unknown"
        moment_normalization: "unknown"
        sklearn_version: ""
        matminer_version: ""
    sklearn:
      name: "sklearn"
      model_name: "magm-donor-compatible"
      artifact_path: "models/magnetism/magmom_model_dxmag.pkl"
      baseline_error: 0.25
      uncertainty_samples: 12
      uncertainty_noise: 0.0001
      uncertainty_seed: 42
      allow_unsafe_compatibility: false
      metadata:
        model_name: "magm-donor-compatible"
        model_version: ""
        artifact_path: "models/magnetism/magmom_model_dxmag.pkl"
        artifact_sha256: ""
        feature_set: "composition_magpie"
        feature_labels: []
        feature_count:
        target_name: ""
        moment_unit: "unknown"
        moment_normalization: "unknown"
        sklearn_version: ""
        matminer_version: ""
    features:
      kind: "composition"
      preset: "magpie"
      feature_order_source: "backend_metadata_required"
    defaults:
      moment_unit: "unknown"
      moment_normalization: "unknown"
    uncertainty_proxy:
      enabled: true
      method: "feature_noise_sensitivity"
      baseline_error: 0.25
    outputs:
      prediction_table: "tables/07_magnetic_descriptors/magnetic_predictions.csv"
      error_table: "tables/07_magnetic_descriptors/magnetic_prediction_errors.csv"
    columns:
      structure_id: "structure_id"
      status: "status"
      error_code: "error_code"
      error_message: "error_message"
      backend: "backend"
      model_name: "model_name"
      predicted_moment_value: "predicted_moment_value"
      moment_unit: "moment_unit"
      moment_normalization: "moment_normalization"
      uncertainty_proxy: "uncertainty_proxy"
      confidence_score: "confidence_score"
      risk_level: "risk_level"
      details: "details"

  magnetic_elements:
    transition_3d:
      - Sc
      - Ti
      - V
      - Cr
      - Mn
      - Fe
      - Co
      - Ni
      - Cu

    selected_4d_5d:
      - Mo
      - Ru
      - Rh
      - Pd
      - Re
      - Os
      - Ir

    lanthanides:
      - Ce
      - Pr
      - Nd
      - Sm
      - Eu
      - Gd
      - Tb
      - Dy
      - Ho
      - Er
      - Tm
      - Yb

  screening_rules:
    require_magnetic_element: true

    reject_classes:
      - "gas"
      - "acid"
      - "base"

    low_priority_classes:
      - "simple_salt"
      - "organic"
      - "molecular"

    high_priority_classes:
      - "oxide"
      - "chalcogenide"
      - "intermetallic"
      - "halide"

  oxidation_state_screening:
    enabled: true
    allow_unknown_oxidation_states: true
    magnetic_valence_hints:
      Fe:
        - 2
        - 3
      Co:
        - 2
        - 3
      Ni:
        - 2
        - 3
      Mn:
        - 2
        - 3
        - 4
      Cr:
        - 2
        - 3
        - 6

  goodenough_kanamori_rules:
    enabled: false
    require_oxide_or_halide_bridge: false
    bridge_elements:
      - O
      - S
      - Se
      - Te
      - F
      - Cl
      - Br
      - I

  outputs:
    magnetic_candidates: "tables/magnetic_descriptors/magnetic_candidates.csv"
    rejected_nonmagnetic: "tables/magnetic_descriptors/rejected_nonmagnetic.csv"
    magnetic_descriptors: "tables/magnetic_descriptors/magnetic_descriptors.csv"
